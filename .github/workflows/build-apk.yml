name: بناء تطبيق دايموند برفيوم

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: فك ضغط المشروع
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ملف المشروع المضغوط غير موجود"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          cp -a extracted/Diamond-Perfume-Repository/. .

      - name: بناء تطبيق أندرويد
        run: gradle assembleDebug --no-daemon

      - name: حفظ ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-Perfume-APK
          path: app/build/outputs/apk/debug/app-debug.apk
